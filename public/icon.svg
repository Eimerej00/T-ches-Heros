<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#312e81" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Playful Shield / Hero Emblem -->
  <g filter="url(#shadow)">
    <path d="M256 80 L380 135 C380 260 256 360 256 360 C256 360 132 260 132 135 Z" fill="#ffffff" />
  </g>

  <!-- Inner Crest -->
  <path d="M256 106 L356 150 C356 250 256 330 256 330 C256 330 156 250 156 150 Z" fill="#eff6ff" />

  <!-- Magic Sparkles / Stars -->
  <circle cx="160" cy="110" r="16" fill="#fde047" />
  <circle cx="360" cy="100" r="12" fill="#fde047" />

  <!-- Huge Checkmark & Star of Victory -->
  <path d="M205 210 L242 248 L312 172" fill="none" stroke="#4f46e5" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Big Golden Star Badge at bottom -->
  <g transform="translate(256, 385)">
    <circle cx="0" cy="0" r="62" fill="#fef3c7" stroke="#fbbf24" stroke-width="8" />
    <polygon points="0,-42 12,-12 44,-10 18,12 26,42 0,24 -26,42 -18,12 -44,-10 -12,-12" fill="url(#starGrad)" />
  </g>
</svg>
